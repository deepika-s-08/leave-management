<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Leave Management System</h1>

        <!-- Login Section -->
        <div id="login-section" class="form-section">
            <h2>Login</h2>

            <form id="login-form">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="btn">Login</button>
            </form>

            <p>
                Don't have an account?
                <button
                    type="button"
                    id="show-registration"
                    class="link-btn"
                >
                    Create User
                </button>
            </p>
        </div>

        <!-- Registration Section -->
        <div
            id="registration-section"
            class="form-section"
            style="display: none;"
        >
            <h2>Create User</h2>

            <form id="registration-form">
                <label for="username">Username:</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="reg-email">Email:</label>
                <input
                    type="email"
                    id="reg-email"
                    placeholder="Enter email"
                    required
                >

                <label for="reg-password">Password:</label>
                <input
                    type="password"
                    id="reg-password"
                    placeholder="Create password"
                    required
                >

                <label for="roll-number">Roll Number:</label>
                <input
                    type="text"
                    id="roll-number"
                    placeholder="Enter roll number"
                    required
                >

                <label for="casual-leave">Initial Casual Leave:</label>
                <input
                    type="number"
                    id="casual-leave"
                    value="10"
                    min="0"
                    step="1"
                    required
                >

                <label for="medical-leave">Initial Medical Leave:</label>
                <input
                    type="number"
                    id="medical-leave"
                    value="10"
                    min="0"
                    step="1"
                    required
                >

                <button type="submit" class="btn">Register</button>
            </form>

            <p>
                Already have an account?
                <button
                    type="button"
                    id="show-login"
                    class="link-btn"
                >
                    Login
                </button>
            </p>

            <div id="registration-response" role="status"></div>
        </div>

        <!-- Leave Balance Section -->
        <div
            id="balance-section"
            class="form-section"
            style="display: none;"
        >
            <h2>Leave Balance</h2>

            <p>
                Welcome, <span id="username-display"></span>
            </p>

            <p>
                Roll Number:
                <span id="roll-number-display"></span>
            </p>

            <div id="leave-balance">
                <p>
                    Casual Leave:
                    <span id="casual-leave-display">—</span>
                </p>

                <p>
                    Medical Leave:
                    <span id="medical-leave-display">—</span>
                </p>
            </div>

            <button
                type="button"
                id="refresh-balance"
                class="btn"
            >
                Refresh Balance
            </button>

            <button
                type="button"
                id="logout-button"
                class="btn"
                style="display: none;"
            >
                Logout
            </button>
        </div>

        <!-- Apply for Leave Section -->
        <div
            id="apply-leave-section"
            class="form-section"
            style="display: none;"
        >
            <h2>Apply for Leave</h2>

            <form id="leave-form">
                <label for="leave-type">Leave Type:</label>
                <select id="leave-type" required>
                    <option value="casual">Casual</option>
                    <option value="medical">Medical</option>
                </select>

                <label for="leave-days">Number of Days:</label>
                <input
                    type="number"
                    id="leave-days"
                    min="1"
                    step="1"
                    required
                >

                <label for="leave-reason">Reason for Leave:</label>
                <input
                    type="text"
                    id="leave-reason"
                    placeholder="Enter reason"
                >

                <button type="submit" class="btn">
                    Apply Leave
                </button>
            </form>
        </div>

        <!-- General Response Message -->
        <div
            id="response-message"
            role="status"
            aria-live="polite"
        ></div>
    </div>
</body>

</html>
